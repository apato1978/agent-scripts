name: Fetch CFO source-native PDFs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/fetch_cfo_sources_temp.py
      - .github/workflows/fetch-cfo-sources-temp.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pypdf pymupdf playwright
          python -m playwright install --with-deps chromium
      - name: Fetch and validate official source files
        run: python tools/fetch_cfo_sources_temp.py
      - name: Upload source files and audit
        uses: actions/upload-artifact@v4
        with:
          name: cfo-source-native-pdfs
          path: cfo-source-native-pdfs/
          if-no-files-found: error
          retention-days: 1
      - name: Commit source audit for retrieval
        if: always()
        run: |
          mkdir -p cfo-source-export-20260825
          cp cfo-source-native-pdfs/SOURCE_AUDIT.json cfo-source-export-20260825/SOURCE_AUDIT.json || true
          cp cfo-source-native-pdfs/SOURCE_ERRORS.json cfo-source-export-20260825/SOURCE_ERRORS.json || true
          cp cfo-source-native-pdfs/SOURCE_PROVENANCE.txt cfo-source-export-20260825/SOURCE_PROVENANCE.txt || true
          cp cfo-source-native-pdfs/SHA256SUMS.txt cfo-source-export-20260825/SHA256SUMS.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cfo-source-export-20260825
          git commit -m "Record CFO source audit" || true
          git push
