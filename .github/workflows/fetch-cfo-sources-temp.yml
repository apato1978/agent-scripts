name: Fetch CFO source-native PDFs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/fetch_cfo_sources_temp.py
      - .github/workflows/fetch-cfo-sources-temp.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pypdf playwright
          python -m playwright install --with-deps chromium
      - name: Fetch and validate official source files
        run: python tools/fetch_cfo_sources_temp.py
      - name: Upload source files and audit
        uses: actions/upload-artifact@v4
        with:
          name: cfo-source-native-pdfs
          path: cfo-source-native-pdfs/
          if-no-files-found: error
          retention-days: 1
